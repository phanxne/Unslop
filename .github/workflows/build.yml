name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: make
      - name: Check arch
        run: lipo -info build/Unslop.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: Unslop.dylib
          path: build/Unslop.dylib
